services:
  postgres:
    image: postgres:16-alpine
    container_name: xandevo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xandevo
      POSTGRES_PASSWORD: xandevo
      POSTGRES_DB: xandevo
    ports:
      - "5432:5432"
    volumes:
      - xandevo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xandevo -d xandevo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xandevo-pgdata:
